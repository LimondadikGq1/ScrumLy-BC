version: '3.1'


services:
  server:
    image: server:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://jira_db/jira'
    depends_on:
      - jira_db
  jira_db:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: adm
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: jira
    ports:
      - "15432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: